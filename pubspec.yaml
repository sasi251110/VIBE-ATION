name: vibe_ation
description: VIBE-ATION - Feel Every Beat. Shape Your Sound. Offline music player for Android.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.3
  just_audio: ^0.9.38
  just_audio_background: ^0.0.1-beta.11
  file_picker: ^8.0.0
  permission_handler: ^11.3.1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
