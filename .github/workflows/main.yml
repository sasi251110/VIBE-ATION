name: VIBE-ATION Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true
      - name: Generate Android platform files if the repo has none
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.vibeation --project-name vibe_ation /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
          fi
          cp android_overlay/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/vibeation/vibe_ation
          cp android_overlay/MainActivity.kt android/app/src/main/kotlin/com/vibeation/vibe_ation/MainActivity.kt
      - run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: vibe-ation-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
