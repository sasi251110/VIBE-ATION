name: VIBE-ATION Android APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter and Dart
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      - name: Verify Flutter Project
        run: |
          test -f pubspec.yaml || {
            echo "ERROR: pubspec.yaml was not found."
            echo "Make sure the Flutter project is in the repository root."
            exit 1
          }

          test -d android || {
            echo "ERROR: Android project folder was not found."
            echo "Make sure this Flutter project includes Android support."
            exit 1
          }

      - name: Install Dependencies
        run: flutter pub get

      - name: Check Dart Formatting
        run: dart format --output=none --set-exit-if-changed lib test
        continue-on-error: true

      - name: Analyze Flutter Project
        run: flutter analyze
        continue-on-error: true

      - name: Run Flutter Tests
        run: |
          if [ -d test ] && find test -type f -name '*_test.dart' | grep -q .; then
            flutter test
          else
            echo "No Flutter test files found. Skipping tests."
          fi
        continue-on-error: true

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-output

          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          cp "$APK_PATH" "build-output/VIBE-ATION-Android.apk"

          echo "APK successfully prepared:"
          ls -lh build-output/VIBE-ATION-Android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: vibe-ation-android-apk
          path: build-output/VIBE-ATION-Android.apk
          if-no-files-found: error
          retention-days: 14
